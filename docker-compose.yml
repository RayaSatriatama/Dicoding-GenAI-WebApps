services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: dicoding-genai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017" # Exposed as requested
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=aichat
    networks:
      - dicoding-genai-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dicoding-genai-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000" # Restricted to localhost to prevent public access
    environment:
      - PORT=3000
      - MONGO=mongodb://mongodb:27017/aichat
      - CLIENT_URL=http://localhost:5175
      - SKIP_AUTH_VERIFICATION=false
      - IMAGE_KIT_ENDPOINT=${IMAGE_KIT_ENDPOINT}
      - IMAGE_KIT_PUBLIC_KEY=${IMAGE_KIT_PUBLIC_KEY}
      - IMAGE_KIT_PRIVATE_KEY=${IMAGE_KIT_PRIVATE_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_JWT_ISSUER=${CLERK_JWT_ISSUER}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:3000
      - UPLOAD_DIR=/app/uploads
      - KOTAEMON_URL=${KOTAEMON_URL:-http://host.docker.internal:7860}
      - KOTAEMON_DB_PATH=/app/ktem_app_data/user_data/sql.db
    volumes:
      - ./backend/uploads:/app/uploads
      - ./.shared/document:/app/shared/document
      - ./ktem_app_data:/app/ktem_app_data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - dicoding-genai-network

  # Frontend Vite Dev Server
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dicoding-genai-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5175:5173" # Restricted to localhost to prevent public access
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - VITE_IMAGE_KIT_ENDPOINT=${IMAGE_KIT_ENDPOINT}
      - VITE_IMAGE_KIT_PUBLIC_KEY=${IMAGE_KIT_PUBLIC_KEY}
      - VITE_IMAGE_KIT_PUBLIC_KEY=${IMAGE_KIT_PUBLIC_KEY}
      - VITE_POST_URL_AGENT=http://localhost:3001/api/kotaemon/chat
      - VITE_PROXY_URL=http://localhost:3001
      - VITE_POST_URL_UPLOAD=http://localhost:3001/api/kotaemon/upload
      - VITE_POST_URL_DELETE_VECTOR=http://localhost:3001/api/kotaemon/delete
    depends_on:
      - backend
    networks:
      - dicoding-genai-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  dicoding-genai-network:
    driver: bridge
