services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: dicoding-genai-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"  # Using 27018 to avoid conflict with local MongoDB
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=aichat
    networks:
      - dicoding-genai-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dicoding-genai-backend
    restart: unless-stopped
    ports:
      - "3001:3000"  # Using 3001 to avoid conflict with other apps
    environment:
      - PORT=3000
      - MONGO=mongodb://mongodb:27017/aichat
      - CLIENT_URL=http://localhost:5174
      - IMAGE_KIT_ENDPOINT=${IMAGE_KIT_ENDPOINT}
      - IMAGE_KIT_PUBLIC_KEY=${IMAGE_KIT_PUBLIC_KEY}
      - IMAGE_KIT_PRIVATE_KEY=${IMAGE_KIT_PRIVATE_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./backend/uploads:/app/uploads
      - ./.shared/document:/app/shared/document
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - dicoding-genai-network

  # Frontend Vite Dev Server
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dicoding-genai-frontend
    restart: unless-stopped
    ports:
      - "5174:5173"  # Using 5174 to avoid conflict with local dev
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - VITE_IMAGE_KIT_ENDPOINT=${IMAGE_KIT_ENDPOINT}
      - VITE_IMAGE_KIT_PUBLIC_KEY=${IMAGE_KIT_PUBLIC_KEY}
    depends_on:
      - backend
    networks:
      - dicoding-genai-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  dicoding-genai-network:
    driver: bridge
